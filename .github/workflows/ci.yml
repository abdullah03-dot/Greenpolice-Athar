name: tests (CPU)

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11"]
    defaults:
      run:
        working-directory: greenpolice_odm_dataset
    env:
      PYTHONUTF8: "1"            # same as environment.yml: Windows would otherwise read sources as cp1252
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: greenpolice_odm_dataset/requirements-ci.txt
      - name: Install CPU test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: pytest (no GPU, no data, no torch/ultralytics)
        run: python -m pytest -m "not gpu and not needs_data and not needs_torch" -ra
      - name: script-only tests (no pytest functions)
        run: |
          python tests/test_rotation_boxes.py
          python tests/test_metrics_vs_coco.py
